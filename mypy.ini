# Static type checking of the runtime (tools/quality.py, 2026-10-13). mypy checks annotated functions; a finding not
# in temp_data/quality/mypy_baseline.txt fails tools/run_nets.py — the rule is NO NEW findings, as for ruff.
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
warn_unused_configs = True
show_error_codes = True
no_color_output = True
cache_dir = temp_data/quality/mypy_cache
exclude = (?x)(^\.venv/|^dummy_test_scripts/|^api_tests/|^tools/|^legacy/|^temp_data/|^TODO/|^scripts/|^blockly/web/)
